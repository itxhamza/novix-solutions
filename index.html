<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novix Solutions - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f2847 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }

        .orb3 {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff0080, #00d4ff);
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: fadeInDown 0.8s ease-out;
        }

        .tagline {
            font-size: 18px;
            color: #00d4ff;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        h1 {
            font-size: 56px;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.2;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            font-weight: 700;
        }

        .subtitle {
            font-size: 18px;
            color: #a0a8c5;
            margin-bottom: 50px;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .cta-section {
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .email-input {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input {
            padding: 16px 24px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: rgba(10, 14, 39, 0.7);
            color: #ffffff;
            font-size: 16px;
            min-width: 280px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: #5a6785;
        }

        input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: rgba(10, 14, 39, 0.9);
        }

        button {
            padding: 16px 48px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            border: none;
            border-radius: 8px;
            color: #0a0e27;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0, 212, 255, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .count-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .count-item:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            transform: translateY(-5px);
        }

        .count-number {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .count-label {
            font-size: 12px;
            color: #a0a8c5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            animation: fadeInUp 0.8s ease-out 1s both;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid rgba(0, 212, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-link:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            color: #00ff88;
            transform: translateY(-5px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .logo {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            input {
                min-width: 100%;
            }

            .countdown {
                gap: 15px;
            }

            .count-item {
                padding: 15px 20px;
            }
        }
    </style>
</head>
